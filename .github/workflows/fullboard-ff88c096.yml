name: Refresh Fullboard CS2 Picks (4h Cadence)

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fullboard-ff88c096
  cancel-in-progress: false

jobs:
  refresh-fullboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Poll HotSpawn lobby + external books, resolve, audit, and render mobile pages
        run: |
          python scripts/ff88c096/collect.py --refresh
          python scripts/ff88c096/resolve.py
          python scripts/ff88c096/audit_repo.py
          python scripts/ff88c096/build.py
          python scripts/build_site.py
          python -m unittest tests/test_ff88c096.py -v

      - name: Commit and push updated CS2 pick'em coverage (4-hour cadence)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ff88c096 fullboard index.html flagged.html cs2.html probabilities.html research.html methodology.html
          if git diff --cached --quiet; then
            echo "No upstream changes since last 4-hour poll."
            exit 0
          fi
          STAMP=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "fullboard(ff88c096): auto-refresh CS2 picks & audit ${STAMP}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 3
          done
