name: today desk (9c44d0e9)

# Phone-first 'today/' executive summary + every-open-match picks.
# Re-joins the retained canonical (c64a5e19) and day-4 (1c8f79f8) boards every
# 4 hours; never edits those boards. No manual input.

on:
  push:
    branches: ['main', 'arena/9c44d0e9-maltaproj2']
    paths:
      - 'scripts/9c44d0e9/**'
      - 'tests/test_9c44d0e9.py'
      - 'data/c64a5e19/board.json'
      - 'data/1c8f79f8/board.json'
      - '.github/workflows/today-9c44d0e9.yml'
  schedule:
    - cron: '42 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-9c44d0e9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build today desk
        run: python3 scripts/9c44d0e9/build.py
      - name: Test
        run: python3 -m unittest tests.test_9c44d0e9 -v
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today data/9c44d0e9
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "today(9c44d0e9): refresh picks $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"
