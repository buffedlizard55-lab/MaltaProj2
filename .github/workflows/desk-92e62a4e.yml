name: desk (92e62a4e)

# Final-day TWC verification + every-match hotspawn coverage.
# Uses existing desk/data/board.json; no manual input. Refreshed every 4h.
on:
  push:
    branches: ['main', 'arena/92e62a4e-maltaproj2']
    paths:
      - 'tests/test_92e62a4e.py'
      - '.github/workflows/desk-92e62a4e.yml'
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk-92e62a4e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all picks, sources and mobile links
        run: python3 -m unittest tests.test_92e62a4e -v
      - name: Stage site (re-renders NAV + landing from desk/data)
        run: python3 scripts/stage_site.py || echo "stage_site.py not required for this scope"
      - name: Commit verification results if changed
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_92e62a4e.py .github/workflows/desk-92e62a4e.yml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "desk(92e62a4e): verify picks + mobile links $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "$REF_NAME" || true
          git push origin "$REF_NAME" || echo "push skipped (may need auth)"
