name: desk (3e1be203)

# Phone-first TWC day-4 + every-match pick desk.
# Renders desk/ entirely from data/c64a5e19/board.json (the canonical capture) plus this
# session's own research file. No network calls, no secrets, no manual input.
#
# Refresh cadence: every 4 hours, and immediately after update-data finishes, which is well
# inside the required 4-8 hour window. The commit is `[skip ci]` on purpose: the Pages
# builder publishes the branch contents, so the site updates without re-running the long
# browser-smoke pipeline. The desk is also re-rendered by scripts/stage_site.py at deploy time.

on:
  push:
    branches: ['main', 'arena/3e1be203-maltaproj2']
    paths:
      - 'scripts/3e1be203/**'
      - 'tests/test_3e1be203.py'
      - 'data/3e1be203/**'
      - 'data/c64a5e19/board.json'
      - '.github/workflows/desk-3e1be203.yml'
  schedule:
    - cron: '12 */4 * * *'
  workflow_run:
    workflows: ['update-data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk-3e1be203-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render desk from the canonical capture
        run: python3 scripts/3e1be203/build.py
      - name: Refresh the landing front door (reads desk/data/board.json)
        run: python3 scripts/build_site.py
      - name: Test the rendered pages
        run: python3 -m unittest tests.test_3e1be203 -v
      - name: Commit if changed
        env:
          REF_NAME: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk data/3e1be203 index.html
          # build_site.py also rewrites uncommitted root/data files; drop those working-tree
          # edits so the rebase below cannot refuse on unstaged changes.
          git checkout -- .
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "desk(3e1be203): refresh picks $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "$REF_NAME"
          git push origin "$REF_NAME"
