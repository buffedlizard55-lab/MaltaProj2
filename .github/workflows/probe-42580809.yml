name: runner-42580809

# Session 42580809: runner-side data collection. GitHub runners have unrestricted egress, so
# every external fetch (odds sources, fixture API, ranking feeds) runs here and the raw results
# are committed back to the session branch as evidence.
#
# Transport note: this environment cannot download workflow artifacts or logs, but it *can* read
# workflow-run annotations on the public run page, so a compact summary of each result is emitted
# as a `::notice::` annotation while the full payloads travel through the commit.

on:
  push:
    branches: ['arena/42580809-maltaproj2']
    paths:
      - 'proof/42580809/run/**'
      - 'proof/42580809/build_*.py'
      - 'proof/42580809/originate.py'
      - '.github/workflows/probe-42580809.yml'
  schedule:
    # Keep the session's evidence, board and published section fresh (hourly).
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner-42580809
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run session runner tasks
        run: |
          mkdir -p proof/42580809/evidence
          for s in fetch_fixtures fetch_reference probe_sources explore_sources inspect_pinnacle collect_lines; do
            f="proof/42580809/run/$s.py"
            if [ -f "$f" ]; then
              echo "=== running $s"
              timeout 900 python3 "$f" 2>&1 | tail -40 || echo "(exit $? from $s, evidence kept)"
            else
              echo "=== skipping $s (not present)"
            fi
          done
          ls -la proof/42580809/evidence || true
      - name: Rebuild and validate the board from the fresh evidence
        continue-on-error: true
        run: |
          set -e
          python3 proof/42580809/build_board.py
          python3 proof/42580809/originate.py
          python3 proof/42580809/build_site.py
          if ! python3 -m unittest tests.test_42580809 -v; then
            echo "::warning title=BOARD_TESTS_FAILED::discarding the regenerated board, keeping the last validated one"
            git checkout -- data/board_42580809.json data/board_42580809.csv \
                            data/originated_42580809.json proof/42580809/evidence site/42580809 || true
            exit 1
          fi
          python3 -c 'import json;d=json.load(open("data/board_42580809.json"));c=d["coverage"];print("::notice title=BOARD_REBUILT::generated "+d["generated_at_utc"]+" fixtures "+str(c["fixtures_total"])+" named "+str(c["fixtures_with_named_line"])+" accepted "+str(c["quotes_accepted"])+" rejected "+str(c["quote_decisions_rejected"]))'
      - name: Summarise results as annotations
        if: always()
        run: |
          python3 - <<'PY' || true
          import json, os, collections
          out = "proof/42580809/evidence"
          def note(title, msg):
              msg = str(msg).replace("%", "%25").replace("\r", " ").replace("\n", " ")
              print(f"::notice title={title}::{msg[:900]}")
          def load(name):
              p = os.path.join(out, name)
              if not os.path.exists(p):
                  return None
              try:
                  with open(p, encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception as exc:
                  return {"_error": f"{type(exc).__name__}: {exc}"}
          fx = load("fixtures.json") or {}
          note("FIXTURES", json.dumps({k: v for k, v in fx.items() if k != "evidence"})[:900])
          vrs = load("vrs_index.json")
          if vrs:
              note("VRS", json.dumps(vrs)[:900])
          lines = load("lines.json") or {}
          if lines.get("lines"):
              c = collections.Counter(l["source_key"] for l in lines["lines"])
              note("LINES", f"{lines.get('collected_at_utc')} total={len(lines['lines'])} {dict(c)}")
          src = load("lines_sources.json") or {}
          note("SOURCES", json.dumps(src)[:900])
          cov = load("coverage.json") or {}
          if cov:
              note("COVERAGE", json.dumps({k: v for k, v in cov.items() if k != "by_tournament"})[:900])
          probe = load("probe.json") or {}
          note("PROBE_REACHABLE", ",".join(probe.get("reachable_200", []))[:900])
          note("EVIDENCE_FILES", ",".join(sorted(os.listdir(out)) if os.path.isdir(out) else []))
          PY
      - name: Commit collected evidence back to the session branch
        if: always()
        continue-on-error: true
        run: |
          set +e
          git config user.name "arena-42580809-runner"
          git config user.email "arena-42580809@users.noreply.github.com"
          git add -A proof/42580809/evidence data/board_42580809.json data/board_42580809.csv \
                    data/originated_42580809.json site/42580809
          if git diff --cached --quiet; then echo "nothing staged"; exit 0; fi
          git commit -m "proof(42580809): runner-collected evidence [skip ci]"
          BR="${GITHUB_REF_NAME}"
          echo "branch=$BR head=$(git rev-parse --short HEAD)"
          PULL=$(git pull --rebase --autostash origin "$BR" 2>&1); echo "pull: $? $(echo "$PULL" | tail -3)"
          PUSH=$(git push origin "HEAD:refs/heads/$BR" 2>&1); RC=$?
          echo "push rc=$RC $(echo "$PUSH" | tail -3)"
          if [ $RC -ne 0 ]; then
            echo "::error title=PUSH_FAILED_$RC::$(echo "$PUSH" | tr '\n' ' ' | cut -c1-600)"
          else
            echo "::notice title=PUSH_OK::$(git rev-parse --short HEAD)"
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-42580809
          path: proof/42580809/evidence
          retention-days: 14
