name: runner-42580809
on:
  push:
    branches: ['arena/42580809-maltaproj2']
    paths:
      - 'proof/42580809/run/**'
      - '.github/workflows/probe-42580809.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: |
          python3 -VV
          python3 proof/42580809/run/probe_sources.py
          python3 proof/42580809/run/fetch_fixtures.py
          python3 proof/42580809/run/fetch_reference.py
          python3 proof/42580809/run/collect_lines.py
      - name: Commit evidence
        run: |
          git config user.name  "runner-42580809"
          git config user.email "runner-42580809@users.noreply.github.com"
          git add -A proof/42580809/evidence
          if git diff --cached --quiet; then
            echo "no evidence changes"; exit 0
          fi
          git commit -m "evidence(42580809): runner refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && { echo "PUSH_OK"; exit 0; }
            sleep 5
          done
          echo "PUSH_FAILED"; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-42580809
          path: proof/42580809/evidence/
          if-no-files-found: ignore
