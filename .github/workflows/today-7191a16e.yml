name: today desk (7191a16e)

# Phone-first 'today/' executive summary + every-open-match picks.
# Reads the canonical collector board (c64a5e19) read-only and applies this
# session's verified research ledger (data/7191a16e/research.json): market lines
# where a two-sided price exists, official-rating model rows where it does not,
# and a direction-only row (blank percentage) where neither exists. Never
# invents a probability and never edits the canonical board.

on:
  push:
    branches: ['main', 'arena/7191a16e-maltaproj2']
    paths:
      - 'scripts/7191a16e/**'
      - 'tests/test_7191a16e.py'
      - 'data/7191a16e/research.json'
      - 'data/c64a5e19/board.json'
      - '.github/workflows/today-7191a16e.yml'
  schedule:
    - cron: '42 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-7191a16e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build today desk
        run: python3 scripts/7191a16e/build.py
      - name: Test
        run: python3 -m unittest tests.test_7191a16e -v
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today data/7191a16e
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "today(7191a16e): refresh picks $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"
