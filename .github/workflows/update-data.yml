name: update-data

on:
  workflow_dispatch:
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect HotSpawn pick'em fixtures (reverse-engineered API)
        run: python3 scripts/fetch_hotspawn.py
      - name: Collect external betting lines
        run: python3 scripts/collect_odds.py || echo "odds collector returned non-zero (evidence kept)"
      - name: Explore external sources (evidence)
        run: python3 scripts/explore_sources.py || echo "explore non-zero (evidence kept)"
      - name: Derive no-vig lines from matched external quotes
        run: python3 scripts/build_lines.py || echo "line builder non-zero (evidence kept)"
      - name: Build static site
        run: python3 scripts/build_site.py
      - name: Commit refreshed data + site
        run: |
          git config user.name "malta-data-bot"
          git config user.email "malta-data-bot@users.noreply.github.com"
          git add -A data evidence docs 2>/dev/null || git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "data: refresh pick'em fixtures, external lines and site [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break || sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-output
          path: |
            data/
            evidence/
          retention-days: 7
