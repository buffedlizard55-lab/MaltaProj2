name: update-data
on:
  workflow_dispatch:
  push:
    branches: [main, arena/dc741cc1-maltaproj2]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Collect fixture snapshot (retain prior inventory on failure)
        id: fixtures
        continue-on-error: true
        run: python scripts/fetch_hotspawn.py
      - name: Collect external quote payloads and record source failures
        run: python scripts/collect_odds.py
      - name: Derive fail-closed current probabilities
        run: python scripts/build_lines.py
      - name: Validate exact lobby coverage, current-line safety and rendered pages
        run: |
          python scripts/build_site.py
          python -m unittest discover -s tests -p 'test_current_lines.py' -v
          python -m unittest discover -s tests -p 'test_58cb2600.py' -v
          python scripts/stage_site.py
      - name: Commit data, evidence and rendered dashboard atomically
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "malta-data-bot"
          git config user.email "malta-data-bot@users.noreply.github.com"
          git add data/ evidence/ assets/ '*.html'
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "data: refresh source-linked fixtures, eligible lines and dashboard"
          # Rebase before every push; a conflict is not resolved by discarding another session.
          for attempt in 1 2 3; do
            git pull --rebase origin "$REF_NAME"
            if git push origin "HEAD:$REF_NAME"; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to publish refresh after three attempts" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-output
          path: |
            data/
            evidence/
          retention-days: 7
