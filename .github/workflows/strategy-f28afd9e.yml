name: strategy picks (f28afd9e)
# Rebuilds strategy/ (safe + leaderboard pick for every HotSpawn lobby CS2 match) from the boards the
# other collectors refresh. Every 4 hours (inside the required 4-8 h window) and after each lobby /
# board refresh, so new lobby matches appear without manual input.
on:
  schedule:
    - cron: '37 */4 * * *'
  workflow_run:
    workflows: ["board (fe803b80)", "live-coverage (3cd9787c)"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/f28afd9e/**'
      - 'data/f28afd9e/context.json'
      - '.github/workflows/strategy-f28afd9e.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: strategy-f28afd9e
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Build every-match strategy board and pages
        run: python scripts/f28afd9e/build.py
      - name: Contract tests and staged link check
        run: |
          python -m unittest tests.test_f28afd9e -v
          python scripts/stage_site.py
      - name: Commit refreshed data and pages
        run: |
          set -euo pipefail
          git config user.name "malta-data-bot"
          git config user.email "malta-data-bot@users.noreply.github.com"
          git add data/f28afd9e strategy
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "strategy(f28afd9e): refresh every-match picks $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::could not push refreshed strategy board"; exit 1
      - name: Request a Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main || echo "dispatch not permitted; next scheduled Pages run publishes"
