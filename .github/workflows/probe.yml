name: Source access probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public documents without authentication
        run: |
          mkdir -p probe
          curl -L --max-time 45 -D probe/lobby.headers https://play.hotspawn.com/lobby -o probe/lobby.html || true
          curl -L --max-time 45 -D probe/odds.headers https://thunderpick.io/esports/cs2-betting -o probe/odds.html || true
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-probe
          path: probe
      - name: Preserve public probe evidence on session branch
        if: github.ref == 'refs/heads/arena/ef111e02-maltaproj2'
        run: |
          mkdir -p docs/evidence/probe
          cp probe/* docs/evidence/probe/
          git config user.name "source-audit-bot"
          git config user.email "source-audit-bot@users.noreply.github.com"
          git add docs/evidence/probe
          git diff --cached --quiet && exit 0
          git commit -m "docs: preserve public HTTP probe evidence [skip ci]"
          git pull --rebase origin arena/ef111e02-maltaproj2
          git push origin arena/ef111e02-maltaproj2
