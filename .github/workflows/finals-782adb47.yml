name: finals (782adb47)

# TWC 2026 Day-5 finals desk + every-match picks. Renders finals/ from the canonical
# capture (data/c64a5e19/board.json) plus this session's research files. No network
# calls beyond checkout, no secrets, no manual input.
# Cadence: every 4 hours and after each canonical refresh (requirement: 4-8 hours).

on:
  push:
    branches: ['main', 'arena/782adb47-maltaproj2']
    paths:
      - 'scripts/782adb47/**'
      - 'tests/test_782adb47.py'
      - 'data/782adb47/**'
      - 'data/c64a5e19/board.json'
      - '.github/workflows/finals-782adb47.yml'
  schedule:
    - cron: '37 */4 * * *'
  workflow_run:
    workflows: ['update-data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finals-782adb47-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render finals desk from the canonical capture
        run: python3 scripts/782adb47/build.py
      - name: Test the rendered pages
        run: python3 -m unittest tests.test_782adb47 -v
      - name: Commit if changed
        env:
          REF_NAME: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finals data/782adb47
          git checkout -- .
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "finals(782adb47): refresh picks $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "$REF_NAME"
          git push origin "$REF_NAME"
