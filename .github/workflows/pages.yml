name: Verify and publish dashboard
on:
  push:
    branches: [main, arena/ff88c096-maltaproj2, arena/cbf92764-maltaproj2, arena/778756a1-maltaproj2, arena/3faf40e8-maltaproj2, arena/ef111e02-maltaproj2, arena/d4ec32a9-maltaproj2, arena/ae75c5c3-maltaproj2, arena/8723ad37-maltaproj2, arena/479ef53e-maltaproj2, arena/69e4c06a-maltaproj2, arena/5468b0ba-maltaproj2, arena/5a40690b-maltaproj2]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Sync downstream derived boards with latest upstream captures
        run: |
          python scripts/6ffacd40/audit.py
          python scripts/a89b76e9/build.py
          python scripts/e1b48771/build.py
          python scripts/ff88c096/resolve.py
          python scripts/ff88c096/audit_repo.py
          python scripts/ff88c096/build.py
          # 907e9435: re-render the every-match mobile board from its committed capture.
          python scripts/907e9435/build.py
          python scripts/build_site.py
      - name: Validate preserved evidence and arithmetic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m unittest discover -s tests -v
      - name: Verify independent audit handoffs
        run: |
          python audits/1d4de836/verify_snapshot.py --html docs/evidence/probe/lobby.txt
          python -m unittest discover -s audits/1916f96c -p 'test_*.py' -v
      - name: Attempt public refresh (preserve snapshot on source failure)
        if: github.ref == 'refs/heads/main'
        run: python scripts/collect.py
      - run: python scripts/build.py
      - name: Re-evaluate canonical picks against source deadlines
        run: |
          run_check() {
            local output status
            output="$(mktemp)"
            if "$@" > "$output" 2>&1; then
              cat "$output"
              rm -f "$output"
            else
              status=$?
              python scripts/cbf92764/annotate_output.py "$*" < "$output"
              rm -f "$output"
              return "$status"
            fi
          }
          run_check python scripts/c64a5e19/build.py
          run_check python scripts/69e4c06a/build.py
          run_check python scripts/5468b0ba/build_audit.py
          run_check python scripts/98dcfc7e/build.py
          run_check python scripts/5a40690b/build.py
          run_check python scripts/7c2622db/build.py
          run_check python scripts/7c2622db/verify.py
          run_check python scripts/6ffacd40/audit.py
          run_check python scripts/a89b76e9/build.py
          run_check python scripts/e1b48771/build.py
          run_check python scripts/ff88c096/resolve.py
          run_check python scripts/ff88c096/audit_repo.py
          run_check python scripts/ff88c096/build.py
          run_check python scripts/7adc7718/collect.py
          run_check python scripts/7adc7718/resolve.py
          run_check python scripts/7adc7718/build.py
          run_check python scripts/build_site.py
      - name: Recheck generated site and every source-linked row
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m unittest discover -s tests -v
      - name: Browser smoke tests
        run: |
          pip install playwright==1.55.0
          python scripts/cbf92764/browser_checks.py
      - name: Stage all session-owned published sections
        run: python scripts/stage_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # verify publication commit ancestry through the official compare API
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publisher.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select and verify the configured Pages publisher
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/6ffacd40/pages_gate.py
      - name: Deploy to GitHub Pages
        if: steps.publisher.outputs.publisher == 'actions'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public dashboard
        run: |
          python scripts/check_deployment.py
          python scripts/cbf92764/check_deployment.py
