name: day3 desk (4cf64ea3)
# Rebuilds day3/ (TWC day-2 review -> day-3 picks, contrarian ladder, pick for every open HotSpawn
# CS2 match) from the boards the other collectors refresh. Every 4 hours (inside the required 4-8 h
# window) and after each upstream board refresh, so new lobby matches (e.g. the TWC playoffs) appear
# without manual input.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_run:
    workflows: ["board (fe803b80)", "strategy picks (f28afd9e)", "live-coverage (3cd9787c)"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/4cf64ea3/**'
      - 'data/4cf64ea3/evidence.json'
      - '.github/workflows/day3-4cf64ea3.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: day3-4cf64ea3
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Build day-3 desk pages and board
        run: python scripts/4cf64ea3/build.py
      - name: Contract tests and staged link check (before any commit — never commit red data)
        run: |
          python -m unittest tests.test_4cf64ea3 -v
          python scripts/stage_site.py
      - name: Commit refreshed board and pages
        run: |
          set -euo pipefail
          git config user.name "malta-data-bot"
          git config user.email "malta-data-bot@users.noreply.github.com"
          git add data/4cf64ea3 day3
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "day3(4cf64ea3): refresh picks $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::could not push refreshed day3 desk"; exit 1
      - name: Request a Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main || echo "dispatch not permitted; next scheduled Pages run publishes"
