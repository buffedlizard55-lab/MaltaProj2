name: explore-pinnacle

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/explore_pinnacle.py'
      - '.github/workflows/explore-pinnacle.yml'

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explore Pinnacle guest API (esports CS2)
        run: python3 scripts/explore_pinnacle.py
      - name: Commit evidence + matchup dump
        run: |
          git config user.name "malta-data-bot"
          git config user.email "malta-data-bot@users.noreply.github.com"
          git add -A evidence data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "evidence: pinnacle probe + matchup dump [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinnacle-out
          path: |
            evidence/pinnacle_probe.json
            data/pinnacle_matchups.json
          retention-days: 7
