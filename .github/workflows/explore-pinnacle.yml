name: explore-pinnacle

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/dump_raw_samples.py'
      - '.github/workflows/explore-pinnacle.yml'

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump raw source samples
        run: python3 scripts/dump_raw_samples.py
      - name: Commit evidence
        run: |
          git config user.name "malta-data-bot"
          git config user.email "malta-data-bot@users.noreply.github.com"
          git add -A evidence
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "evidence: raw source structure samples [skip ci]"
            for i in 1 2 3; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break || sleep 5; done
          fi
