name: everymatch (19d6c262)

# Session 19d6c262 / "a pick for every open HotSpawn CS2 match". Re-reads the newest OURLINE
# board (featured market picks) and the official Valve Regional Standings, re-derives a pick
# for EVERY open fixture (VRS model for both-rated, a labelled directional estimate when only
# one is rated), re-renders everymatch/ and commits. Scope guard: writes only data/19d6c262/**
# and everymatch/**. HotSpawn is used only to know which matches exist; no crowd % is a number.
on:
  push:
    branches: ['arena/19d6c262-maltaproj2', 'main']
    paths:
      - 'scripts/19d6c262/**'
      - 'tests/test_19d6c262.py'
      - '.github/workflows/everymatch-19d6c262.yml'
  schedule:
    - cron: '13 */4 * * *'   # every 4 hours (brief: 4-8h)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: everymatch-19d6c262-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official Valve Regional Standings (+ per-team details)
        run: python3 scripts/19d6c262/collect_vrs.py
      - name: Resolve a pick for every open fixture (reads the newest OURLINE board)
        run: python3 scripts/19d6c262/resolve.py
      - name: Build pages (re-derives every number)
        run: python3 scripts/19d6c262/build.py
      - name: Tests
        run: python3 -m unittest tests.test_19d6c262 -v
      - name: Commit and push (rebase before every push; never discards other sessions' work)
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "everymatch-bot (19d6c262)"
          git config user.email "malta-data-bot@users.noreply.github.com"
          git add data/19d6c262 everymatch
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "everymatch(19d6c262): pick for every open match $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$REF_NAME" && git push origin "HEAD:$REF_NAME"; then
              if [ "$REF_NAME" = "main" ]; then gh workflow run pages.yml --ref main || echo "pages dispatch failed"; fi
              exit 0
            fi
            sleep $((attempt * 7))
          done
          exit 1
