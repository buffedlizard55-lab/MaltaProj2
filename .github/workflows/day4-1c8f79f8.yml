name: day4 desk (1c8f79f8)
# Rebuilds day4/ (TWC 2026 day-4 semifinal picks + a pick and probability for
# every open HotSpawn CS2 fixture) from a fresh fixtures-API capture and the
# curated research ledger. Every 4 hours (inside the required 4-8 h window),
# after upstream board refreshes, and on demand.
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_run:
    workflows: ["board (fe803b80)", "every-match picks (c64a5e19)"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/1c8f79f8/**'
      - 'data/1c8f79f8/fixtures_raw.json'
      - '.github/workflows/day4-1c8f79f8.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: day4-1c8f79f8
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Fresh fixtures-API capture (evidence retained before any derivation)
        run: python scripts/1c8f79f8/collect.py
      - name: Build day-4 desk pages and board
        run: python scripts/1c8f79f8/build.py
      - name: Contract tests and staged link check (before any commit — never commit red data)
        run: |
          python -m unittest tests.test_1c8f79f8 -v
          python scripts/stage_site.py
      - name: Commit refreshed board and pages
        run: |
          set -euo pipefail
          git config user.name "malta-data-bot"
          git config user.email "malta-data-bot@users.noreply.github.com"
          git add data/1c8f79f8 day4
          # drop render churn from scripts/stage_site.py in other sessions'
          # paths — an unstaged tree makes git pull --rebase refuse every attempt
          git checkout -- . || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "day4(1c8f79f8): refresh picks $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::could not push refreshed day4 desk"; exit 1
      - name: Request a Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main || echo "dispatch not permitted; next scheduled Pages run publishes"
